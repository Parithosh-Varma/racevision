[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "racevision"
version = "0.1.0"
description = "Collect driver-behavior data from race stream URLs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "yt-dlp>=2024.1.1",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
racevision = "racevision.cli:main"

[tool.setuptools]
packages = ["racevision"]
